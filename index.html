<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controle de Gestão</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root{--bg:#f4f5f7;--card:#fff;--tx:#18222d;--mut:#667385;--bd:#e0e4ea;--ac:#0f5c4d;--ac-t:#fff;--pos:#16794c;--neg:#b3382c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--card:#1a212a;--tx:#e8ecf1;--mut:#92a0b1;--bd:#2a3440;--ac:#3fb59b;--ac-t:#08201a;--pos:#4cc58a;--neg:#ef8073;color-scheme:dark}}
    body.pdf{--bg:#fff;--card:#fff;--tx:#18222d;--mut:#667385;--bd:#e0e4ea;--ac:#0f5c4d;--ac-t:#fff;--pos:#16794c;--neg:#b3382c}
    *{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
    h1{margin:0;font-size:22px;letter-spacing:-.01em}.sub{color:var(--mut);font-size:12px}
    .act{display:flex;gap:8px;flex-wrap:wrap}
    button,.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--ac-t);cursor:pointer}
    .ghost{background:transparent;color:var(--ac)}
    .btn-danger{background:var(--neg);border-color:var(--neg);color:#fff}
    nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}
    nav button{background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;white-space:nowrap}
    nav button.on{color:var(--ac);border-color:var(--ac)}
    main{max-width:1200px;margin:0 auto;padding:16px 20px 40px}
    #flt{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
    label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px}
    select,input[type=text],input[type=email],input[type=password],input:not([type]){font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:130px}
    .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
    .k,.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
    .k small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.k b{display:block;font-size:21px;margin-top:2px}
    .pos{color:var(--pos)}.neg{color:var(--neg)}
    .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:14px}
    .c h3{margin:0 0 8px;font-size:13px}.ch{position:relative;height:250px}
    .tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}
    th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
    td.n,th.n{text-align:right}.note{color:var(--mut);font-size:12px;margin:8px 0}
    .rel h2{font-size:16px;margin:20px 0 6px;color:var(--ac)}.rel p,.rel li{max-width:78ch}
    .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--ac);font-size:15px;font-weight:700}.sh.pj{border-color:#c8963e}.sh span{font-weight:400;color:var(--mut);font-size:12px}
    .pdfh{display:none;font-weight:700;margin-bottom:12px;border-bottom:2px solid var(--ac);padding-bottom:6px}
    body.pdf .pdfh{display:block}body.pdf .tw{overflow:visible}body.pdf th{position:static}
    #drop{display:none;position:fixed;inset:0;background:rgba(15,92,77,.85);color:#fff;font-size:22px;align-items:center;justify-content:center;z-index:9}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:10}
    .hidden{display:none!important}
    
    /* Login Box */
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:20px}
    .auth-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:28px;width:100%;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  </style>
</head>
<body>

  <!-- Tela de Login com E-mail e Senha -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 style="margin:0 0 16px 0;font-size:20px;color:var(--ac)">Controle de Gestão</h2>
      
      <label style="margin-bottom:12px">E-mail
        <input type="email" id="auth-email" placeholder="nome@exemplo.com" required>
      </label>
      
      <label style="margin-bottom:16px">Senha
        <input type="password" id="auth-pass" placeholder="••••••••" required>
      </label>
      
      <div>
        <button id="btn-login" style="width:100%">Entrar</button>
      </div>
      
      <div id="auth-msg" style="margin-top:12px;font-size:12px;color:var(--neg)"></div>
    </div>
  </div>

  <!-- Tela da Aplicação -->
  <div id="app-screen" class="hidden">
    <header>
      <div>
        <h1>Controle de Gestão</h1>
        <div class="sub" id="src">Carregando dados...</div>
      </div>
      <div class="act">
        <label class="btn ghost" style="flex-direction:row;font-size:14px;color:var(--ac)">
          Importar manual
          <input type="file" id="file" accept=".xlsx,.xls,.xlsm" hidden>
        </label>
        <button id="pdf">Exportar PDF da tela</button>
        <button id="btn-logout" class="btn-danger">Sair</button>
      </div>
    </header>

    <nav id="nav"></nav>
    <main>
      <div id="flt"></div>
      <div id="main">
        <div class="pdfh" id="pdfh"></div>
        <div id="body"></div>
      </div>
    </main>
  </div>

  <div id="drop">Solte a planilha para importar</div>
  <div id="toast"></div>

  <!-- Script da aplicação como módulo ES -->
  <script type="module" src="app.js"></script>
</body>
</html>
